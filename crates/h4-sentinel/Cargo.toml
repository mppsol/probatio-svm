[package]
name = "h4-sentinel"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "H4 G0 Klend upgrade behaviour sentinel evidence tooling"

# This must remain a separate workspace: mixing LiteSVM's unbundled Solana crates
# with the root workspace's dependency graph has previously produced duplicate
# incompatible Solana crates.  It is excluded by the root workspace.
[workspace]

[dependencies]
# Copied from Solvo's proven g1-kamino dependency set.  Do not add solana-sdk.
litesvm = "=0.13.1"
solana-account = "3"
solana-clock = "3"
solana-pubkey = "4"
solana-keypair = "3"
solana-signer = "3"
solana-instruction = "3"
solana-message = "3"
solana-transaction = "3"
solana-hash = "4"
solana-transaction-error = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
flate2 = "1"
sha2 = "0.10"

# SUPPLY-CHAIN PIN: arrayref 0.3.10 must never be resolved here.
arrayref = "=0.3.9"

[patch.crates-io]
hermit-abi = { path = "../../vendor/hermit-abi" }
